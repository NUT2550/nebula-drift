<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEBULA DRIFT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 5 L90 80 L50 60 L10 80 Z' fill='%235ee9ff'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#04060f;overflow:hidden;color:#c6d2ec;
 font-family:'Chakra Petch',monospace;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:
  radial-gradient(1100px 760px at 72% -12%,#0c1238 0%,transparent 60%),
  radial-gradient(900px 700px at 8% 112%,#180c2e 0%,transparent 55%),
  radial-gradient(700px 500px at 50% 50%,#070a1c 0%,#04060f 80%)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
 background-image:
  radial-gradient(1px 1px at 20% 30%,#9db8e8,transparent),
  radial-gradient(1px 1px at 70% 65%,#cfe2ff,transparent),
  radial-gradient(1.5px 1.5px at 40% 80%,#5ee9ff,transparent),
  radial-gradient(1px 1px at 85% 20%,#c9b8ff,transparent),
  radial-gradient(1px 1px at 55% 45%,#ffd9a8,transparent);
 background-size:340px 340px,280px 280px,400px 400px,320px 320px,360px 360px;
 animation:tw 9s ease-in-out infinite alternate,drift 140s linear infinite}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.06;
 background:repeating-linear-gradient(0deg,#5ee9ff 0 1px,transparent 1px 4px);
 animation:sweep 7s linear infinite}
@keyframes tw{to{opacity:.22}}
@keyframes drift{to{background-position:0 340px,0 -280px,0 400px,0 -320px,0 360px}}
@keyframes sweep{to{transform:translateY(4px)}}
#wrap{position:fixed;inset:0;z-index:1;display:flex;justify-content:center;align-items:center}
#crt{position:relative;animation:frameGlow 4.5s ease-in-out infinite}
@keyframes frameGlow{0%,100%{box-shadow:0 0 0 1px #16234a,0 0 38px rgba(70,130,255,.16),0 18px 48px rgba(0,0,0,.6)}
 50%{box-shadow:0 0 0 1px #234,0 0 56px rgba(94,233,255,.28),0 18px 48px rgba(0,0,0,.6)}}
canvas{display:block;height:min(96vh,760px);aspect-ratio:9/16;image-rendering:pixelated;background:#03040a}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(3,6,16,.22) 0 1px,transparent 1px 3px);pointer-events:none;opacity:.5}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 52px rgba(2,4,12,.88);pointer-events:none}
.hbtn{position:absolute;z-index:30;pointer-events:auto;background:rgba(10,16,36,.72);border:1px solid #2c3d76;
 color:#fff;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;
 font-family:'Chakra Petch',monospace;font-weight:700;backdrop-filter:blur(2px);transition:.14s}
.hbtn:hover{border-color:#5ee9ff;box-shadow:0 0 12px rgba(94,233,255,.4);transform:translateY(-1px)}
.hbtn:active{background:rgba(94,233,255,.3);transform:scale(.92)}
#b-mute{top:10px;right:10px;width:34px;height:34px;font-size:16px}
#b-rank{top:10px;left:10px;width:58px;height:30px;font-size:11px;color:#ffd700;letter-spacing:1px}
#b-pause{top:10px;right:52px;width:34px;height:34px;font-size:13px}
#touch{position:absolute;inset:0;pointer-events:none;display:none;z-index:20}
#touch.on{display:block}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-weight:700;font-size:10px;color:#fff;background:rgba(44,61,118,.42);border:1px solid rgba(94,233,255,.4);
 backdrop-filter:blur(2px);transition:.1s;font-family:'Chakra Petch',monospace}
.tbtn:active{background:rgba(94,233,255,.5);transform:scale(.9)}
#t-dash{bottom:26px;right:24px;width:64px;height:64px;border-color:#ffa03c;color:#ffa03c}
#t-bomb{bottom:36px;right:98px;width:52px;height:52px;border-color:#ff4d6d;color:#ff4d6d}
#t-wep{bottom:98px;left:24px;width:52px;height:52px;border-color:#9a7bff;color:#9a7bff}
#t-info{bottom:26px;left:24px;width:44px;height:44px;border-color:#c6d2ec}
.ov{display:none;position:absolute;inset:0;z-index:100;background:rgba(5,8,16,.95);pointer-events:auto;
 flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto;padding:16px}
.ov.show{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.panel{background:linear-gradient(180deg,rgba(12,18,41,.92),rgba(8,12,28,.92));border:1px solid #2c3d76;
 padding:22px;border-radius:10px;width:min(92%,400px);box-shadow:0 0 22px rgba(0,0,0,.55),inset 0 0 0 1px rgba(94,233,255,.06);position:relative}
.panel::before{content:"";position:absolute;top:-1px;left:-1px;width:16px;height:16px;border-top:2px solid #5ee9ff;border-left:2px solid #5ee9ff}
.panel::after{content:"";position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-bottom:2px solid #ffa03c;border-right:2px solid #ffa03c}
.panel h2{color:#5ee9ff;letter-spacing:3px;font-size:17px;margin-bottom:14px;text-transform:uppercase;
 font-family:'Press Start 2P',monospace;font-weight:400;text-shadow:0 0 14px rgba(94,233,255,.4)}
.scrap{color:#ffa03c;font-size:18px;font-weight:700;margin-bottom:16px;letter-spacing:1px}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.up{background:rgba(255,255,255,.04);border:1px solid #1d2b55;border-radius:6px;padding:9px;cursor:pointer;
 text-align:left;transition:.13s;position:relative;overflow:hidden}
.up:hover{border-color:#5ee9ff;background:rgba(94,233,255,.1);transform:translateY(-2px);box-shadow:0 4px 14px rgba(94,233,255,.18)}
.up.max{opacity:.42;cursor:default}
.up.max:hover{transform:none;border-color:#1d2b55;background:rgba(255,255,255,.04);box-shadow:none}
.up .n{font-size:10px;color:#c6d2ec;font-weight:600;letter-spacing:.5px}
.up .l{font-size:10px;color:#ffa03c;float:right;font-weight:700}
.up .c{font-size:9px;color:#ffd700;display:block;margin-top:4px}
.up .d{font-size:9px;color:#67759f;display:block;margin-top:2px}
.abtn{background:linear-gradient(45deg,#2c3d76,#5ee9ff);border:none;padding:13px 30px;color:#04121a;font-weight:700;
 font-size:14px;border-radius:6px;cursor:pointer;text-transform:uppercase;margin-top:8px;letter-spacing:2px;
 box-shadow:0 0 14px rgba(94,233,255,.4);transition:.13s;font-family:'Chakra Petch',monospace;position:relative;overflow:hidden}
.abtn:hover{box-shadow:0 0 24px rgba(94,233,255,.7);transform:translateY(-2px)}
.abtn:active{transform:scale(.96)}
#name-ov input{background:#0a1024;border:2px solid #5ee9ff;color:#fff;padding:11px;font-size:18px;text-align:center;
 border-radius:6px;width:210px;margin:12px 0;font-family:'Press Start 2P',monospace;letter-spacing:2px;outline:none;transition:.15s}
#name-ov input:focus{box-shadow:0 0 18px rgba(94,233,255,.55);border-color:#fff}
#name-ov button{background:#ffa03c;border:none;padding:11px 24px;color:#1a0e02;font-weight:700;border-radius:6px;
 cursor:pointer;letter-spacing:2px;transition:.13s}
#name-ov button:hover{background:#ffb866;box-shadow:0 0 16px rgba(255,160,60,.5)}
table.lb{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.lb th{color:#5ee9ff;border-bottom:1px solid #2c3d76;padding:6px;text-align:left;font-size:10px;letter-spacing:1px}
.lb td{padding:6px;border-bottom:1px solid rgba(255,255,255,.07)}
.lb tr{transition:.12s}.lb tbody tr:hover{background:rgba(94,233,255,.06)}
.r1{color:#ffd700;font-weight:700}.r2{color:#d6dde6;font-weight:700}.r3{color:#cd7f32;font-weight:700}
.hint{margin-top:12px;font-size:10px;color:#67759f;letter-spacing:.5px;line-height:1.6}
.empty{color:#67759f;padding:18px;font-size:12px}
</style>
</head>
<body>
<div id="wrap"><div id="crt">
<canvas id="cv" width="270" height="480"></canvas>
<div class="scan"></div><div class="vig"></div>
<button id="b-rank" class="hbtn">RANK</button>
<button id="b-pause" class="hbtn">II</button>
<button id="b-mute" class="hbtn">🔊</button>
<div id="touch">
 <div id="t-dash" class="tbtn">DASH</div>
 <div id="t-bomb" class="tbtn">BOMB</div>
 <div id="t-wep" class="tbtn">WP</div>
 <div id="t-info" class="tbtn">i</div>
</div>
<div id="hangar-ov" class="ov"><div class="panel">
 <h2>Hangar</h2>
 <div class="scrap">SCRAP <span id="hg-scrap">0</span></div>
 <div class="ugrid" id="hg-up"></div>
 <button id="b-launch" class="abtn">LAUNCH ▶</button>
 <div class="hint">ENTER = ออกรบ · ซื้ออัปเกรดให้ยานเก่งขึ้น<br>ข้อมูลบันทึกในเครื่องนี้</div>
</div></div>
<div id="lb-ov" class="ov"><div class="panel">
 <h2>Top Pilots</h2>
 <table class="lb"><thead><tr><th>#</th><th>Pilot</th><th>Score</th><th>Wave</th></tr></thead><tbody id="lb-body"></tbody></table>
 <button id="b-lbback" class="abtn" style="font-size:11px;padding:9px 18px">BACK</button>
</div></div>
<div id="name-ov" class="ov"><div class="panel">
 <h2 style="color:#ffd700">NEW RECORD!</h2>
 <p style="font-size:12px;color:#aaa">ตั้งชื่อนักบินของคุณ</p>
 <input type="text" id="pname" maxlength="12" value="PILOT"><br>
 <button id="b-submit">SUBMIT</button>
</div></div>
</div></div>

<script>
(()=>{'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const IW=cv.width,IH=cv.height,TAU=Math.PI*2;
ctx.imageSmoothingEnabled=false;
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const $=id=>document.getElementById(id);

const DEF={scrap:0,up:{hp:0,power:0,bomb:0,dash:0,magnet:0,shield:0}};
let meta;try{const s=localStorage.getItem('nd-meta');meta=s?JSON.parse(s):JSON.parse(JSON.stringify(DEF));}catch(e){meta=JSON.parse(JSON.stringify(DEF));}
const saveMeta=()=>{try{localStorage.setItem('nd-meta',JSON.stringify(meta));}catch(e){}};
const UPG=[
 {id:'hp',name:'MAX HP',max:5,cost:[50,80,120,170,230],desc:'+20 เลือด'},
 {id:'power',name:'START PWR',max:2,cost:[80,150],desc:'เริ่มอาวุธ Lv สูง'},
 {id:'bomb',name:'EXTRA BOMB',max:3,cost:[60,100,150],desc:'+1 บอมบ์'},
 {id:'dash',name:'DASH BOOST',max:3,cost:[70,110,160],desc:'แดชไวขึ้น'},
 {id:'magnet',name:'MAGNET',max:3,cost:[60,100,150],desc:'ดูดของไกลขึ้น'},
 {id:'shield',name:'SHIELD',max:3,cost:[90,140,200],desc:'+20 โล่เริ่ม'}];

let scores=[];try{const s=localStorage.getItem('nd-scores');scores=s?JSON.parse(s):[];}catch(e){scores=[];}
const saveScores=()=>{try{localStorage.setItem('nd-scores',JSON.stringify(scores));}catch(e){}};

const S={state:'title',t:0,score:0,best:+(localStorage.getItem('nd-best')||0),wave:0,chain:0,chainT:0,mult:1,shake:0,flash:0,hitFlash:0,banner:'',bannerT:0,
 spawnQueue:[],spawnT:0,inter:0,boss:null,overT:0,newRec:false,showStats:false,muted:false,crits:{},pendingScore:false};
let dashCdBase=85,magnetR=110;
const P={x:IW/2,y:IH-50,r:5,hp:100,maxHp:100,sh:0,sp:2.7,w:0,lvl:[1,1,1],cd:0,dashT:0,dashCd:0,dx:0,dy:-1,inv:0,bombs:2,alive:true};
const WEAPONS=[{name:'SPREAD',color:'#ffa03c',cd:9},{name:'LASER',color:'#5ee9ff',cd:13},{name:'HOMING',color:'#9a7bff',cd:22}];
const CRIT_CHANCE=0.15,CRIT_MULT=2;
let pB=[],eB=[],enemies=[],parts=[],pickups=[],popups=[];
const crit=id=>{if(S.crits[id])return;S.crits[id]=true;};

let AC=null,master,musicGain,nbuf=null,mNext=0,mStep=0;
const getNB=()=>{if(!nbuf&&AC){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return nbuf;};
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
 musicGain=AC.createGain();musicGain.gain.value=S.muted?0:.5;musicGain.connect(master);
 mNext=AC.currentTime+.1;setInterval(schedule,40);}
function tone(ty,f0,f1,dur,vol,wh){if(!AC||S.muted)return;const t=AC.currentTime+(wh||0),o=AC.createOscillator(),g=AC.createGain();
 o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);}
function nz(dur,vol,f0,f1){if(!AC||S.muted)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=getNB();
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.03);}
const SFX={
 shoot(w){if(w===1)tone('sawtooth',1500,320,.11,.045);else if(w===2)tone('triangle',420,900,.1,.06);else tone('square',900,240,.07,.04);},
 hit(){tone('square',240,120,.05,.045);},snipe(){tone('sawtooth',1900,180,.16,.07);},
 boom(b){nz(b?.55:.3,b?.28:.16,b?900:1400,80);tone('sine',b?150:210,38,b?.5:.28,b?.22:.12);},
 hurt(){tone('sawtooth',320,70,.22,.1);},pickup(){tone('sine',660,660,.07,.08);tone('sine',990,990,.09,.08,.07);},
 dash(){nz(.13,.06,4200,900);},bomb(){nz(.7,.3,700,50);tone('sine',95,28,.7,.26);tone('square',1400,90,.5,.05);},
 alarm(){for(let i=0;i<3;i++){tone('square',540,540,.12,.06,i*.28);tone('square',400,400,.12,.06,i*.28+.14);}},
 buy(){tone('sine',520,780,.1,.08);tone('sine',780,1040,.1,.08,.08);}};
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(36,t+.12);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+.17);}
function hat(t){const s=AC.createBufferSource();s.buffer=getNB();const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const g=AC.createGain();g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(musicGain);s.start(t);s.stop(t+.06);}
function bassN(t,fr){const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=fr;fl.type='lowpass';fl.frequency.value=320;g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(fl);fl.connect(g);g.connect(musicGain);o.start(t);o.stop(t+.26);}
function lead(t,fr){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=fr;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+.24);}
function schedule(){const step=60/112/2;while(AC&&mNext<AC.currentTime+.12){playStep(mStep,mNext);mStep=(mStep+1)%32;mNext+=step;}}
function playStep(s,t){if(s%2===0)kick(t);else hat(t);const bar=Math.floor(s/8)%4;bassN(t,[55,49,65.41,41.2][bar]);if(s%2===0||bar>=2)lead(t,[220,261.63,329.63,392,329.63,261.63,220,196.33][s%8]*(bar>=2?2:1));}

const keys=new Set(),just=new Set();
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();if(!keys.has(e.code))just.add(e.code);keys.add(e.code);initAudio();});
addEventListener('keyup',e=>keys.delete(e.code));
cv.style.touchAction='none';cv.style.userSelect='none';
let _drag=false,_lx=0,_ly=0;
const _toC=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};};
cv.onpointerdown=function(e){e.preventDefault();initAudio();
 if(S.state==='title'){openHangar();return;}
 if(S.state==='over'&&S.overT>45){afterDeath();return;}
 if(S.state==='play'){_drag=true;const p=_toC(e);_lx=p.x;_ly=p.y;}};
cv.onpointermove=function(e){if(!_drag||!P.alive||S.state!=='play')return;e.preventDefault();
 const p=_toC(e),dx=p.x-_lx,dy=p.y-_ly;_lx=p.x;_ly=p.y;
 if(dx||dy){P.x=clamp(P.x+dx,8,IW-8);P.y=clamp(P.y+dy,10,IH-8);P.dx=dx||P.dx;P.dy=dy||P.dy;crit('fly');}};
cv.onpointerup=cv.onpointercancel=cv.onpointerleave=function(){_drag=false;};
cv.oncontextmenu=e=>e.preventDefault();
const isTouch='ontouchstart'in window||navigator.maxTouchPoints>0;
if(isTouch)$('touch').classList.add('on');
function bindBtn(id,fn){const el=$(id);if(!el)return;el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();initAudio();fn();});}
bindBtn('t-dash',()=>{if(S.state==='play'&&P.dashCd<=0&&P.dashT<=0){P.dashT=11;P.dashCd=dashCdBase;P.inv=Math.max(P.inv,17);SFX.dash();crit('dash');}});
bindBtn('t-bomb',()=>{if(S.state==='play')doBomb();});
bindBtn('t-wep',()=>{if(S.state==='play'){P.w=(P.w+1)%3;crit('switch');popup(P.x,P.y-14,WEAPONS[P.w].name+' Lv'+P.lvl[P.w],WEAPONS[P.w].color);}});
bindBtn('t-info',()=>{S.showStats=!S.showStats;});
bindBtn('b-mute',()=>{initAudio();S.muted=!S.muted;if(musicGain)musicGain.gain.value=S.muted?0:.5;$('b-mute').textContent=S.muted?'🔇':'';});
bindBtn('b-pause',()=>{if(S.state==='play'||S.state==='pause')S.state=S.state==='play'?'pause':'play';});
bindBtn('b-rank',()=>{renderLB();$('lb-ov').classList.add('show');});
bindBtn('b-lbback',()=>{$('lb-ov').classList.remove('show');});
bindBtn('b-launch',()=>{if(S.state==='hangar')startGame();});
bindBtn('b-submit',()=>{submitScore();});

let gpIndex=null;
addEventListener('gamepadconnected',e=>{gpIndex=e.gamepad.index;});
addEventListener('gamepaddisconnected',e=>{if(gpIndex===e.gamepad.index)gpIndex=null;});
function pollGamepad(){if(gpIndex===null)return;const gp=navigator.getGamepads()[gpIndex];if(!gp)return;
 let mx=0,my=0;const dz=.2;
 if(Math.abs(gp.axes[0])>dz)mx=gp.axes[0]>0?1:-1;if(Math.abs(gp.axes[1])>dz)my=gp.axes[1]>0?1:-1;
 if(gp.buttons[14]&&gp.buttons[14].pressed)my=1;if(gp.buttons[12]&&gp.buttons[12].pressed)my=-1;
 if(gp.buttons[15]&&gp.buttons[15].pressed)mx=1;if(gp.buttons[13]&&gp.buttons[13].pressed)mx=-1;
 if((mx||my)&&P.alive&&S.state==='play'){P.x=clamp(P.x+mx*P.sp*.9,8,IW-8);P.y=clamp(P.y+my*P.sp*.9,10,IH-8);crit('fly');}
 const b=gp.buttons;
 if(b[0]&&b[0].pressed&&!b[0].was&&P.dashCd<=0&&P.dashT<=0&&S.state==='play'){P.dashT=11;P.dashCd=dashCdBase;P.inv=Math.max(P.inv,17);SFX.dash();crit('dash');}
 if(b[2]&&b[1]&&(b[2].pressed||b[1].pressed)&&!(b[2].was||b[1].was)&&S.state==='play')doBomb();
 if(b[4]&&b[4].pressed&&!b[4].was&&S.state==='play'){P.w=(P.w+2)%3;crit('switch');popup(P.x,P.y-14,WEAPONS[P.w].name+' Lv'+P.lvl[P.w],WEAPONS[P.w].color);}
 if(b[5]&&b[5].pressed&&!b[5].was&&S.state==='play'){P.w=(P.w+1)%3;crit('switch');popup(P.x,P.y-14,WEAPONS[P.w].name+' Lv'+P.lvl[P.w],WEAPONS[P.w].color);}

 else{b.x=IW/2+Math.sin(b.t*.005)*20;b.t+=dt;

function updatePlay(dt){

  if(!b.gone&&S.boss&&!S.boss.dead&&(S.boss.x-b.x)**2+(S.boss.y-b.y)**2<(S.boss.r+b.r)**2){damageBoss(b.dmg,b.crit);spark(b.x,b.y);if(b.kind===1){b.pierce--;if(b.pierce<=0)b.gone=true;}else b.gone=true;}}
